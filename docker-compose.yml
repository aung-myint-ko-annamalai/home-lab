services:
  db:
    image: postgres:17
    container_name: home-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: home-db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d home_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      tags:
        - expressjs-products-docker
    container_name: express-products
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=${SERVER_PORT}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      tags:
        - nextjs-products-docker
    container_name: nextjs-products
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file:
      - .env
    environment:
      - PORT=${CLIENT_PORT}

volumes:
  db_data:
